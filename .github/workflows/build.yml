name: build

# The EXE is a copy of the runner's own node.exe with the program appended, so the
# build has to run on Windows. A Linux runner would produce a Linux binary.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # The tests that need real recordings skip themselves when the savegame folder
      # is missing, which it is on a runner. The rest run.
      - name: Tests
        run: npm test

      # Only a tag build carries a version. Without one the EXE calls itself "dev" and
      # never looks for an update, which is right for a build off a branch.
      - name: Build the EXE
        env:
          EAPM_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run build

      - name: Check the package
        shell: pwsh
        run: |
          $expected = @('eAPMCounter.exe', 'eAPMCounter.exe.sha256', 'config.txt', 'README.txt', 'THIRD_PARTY_LICENSES.md')
          $actual = (Get-ChildItem dist -File | Select-Object -ExpandProperty Name | Sort-Object)
          $missing = $expected | Where-Object { $_ -notin $actual }
          if ($missing) { throw "missing from dist: $($missing -join ', ')" }
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize

      # Downloading this artifact gives a .zip holding the files above.
      - uses: actions/upload-artifact@v7
        with:
          name: eAPMCounter-windows-x64
          path: dist/
          if-no-files-found: error

  # A tag starting with v publishes a release and hangs the package on it, so the
  # download outlives the 90 days an artifact is kept. The package is the one the
  # build job just made; nothing is built twice.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eAPMCounter-windows-x64
          path: package

      - name: Pack the ZIP
        run: |
          cd package
          zip -r "../eAPMCounter-${GITHUB_REF_NAME}-windows-x64.zip" .
          cd ..
          unzip -l "eAPMCounter-${GITHUB_REF_NAME}-windows-x64.zip"

      # The bare EXE and its checksum go up beside the ZIP. The program updates itself
      # from those two, so it needs no way to unpack an archive.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out, so gh cannot read the repository
          # from a git remote and has to be told which one it is.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "eAPMCounter-${GITHUB_REF_NAME}-windows-x64.zip" \
            "package/eAPMCounter.exe" \
            "package/eAPMCounter.exe.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
